<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #081b33,
                #0072ff,
                #00c6ff,
                #6a11cb
            );

            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .login-card {

            width: 400px;

            padding: 40px;

            background: rgba(255,255,255,0.95);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.35);

            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .admin-icon {

            width: 80px;
            height: 80px;

            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 40px;

            color: white;

            background: linear-gradient(
                135deg,
                #0072ff,
                #6a11cb
            );

            box-shadow:
                0 10px 25px rgba(0,0,0,0.25);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        h2 {

            margin-top: 20px;

            text-align: center;

            font-weight: 800;

            background: linear-gradient(
                90deg,
                #0066ff,
                #6a11cb
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            text-align: center;

            color: #667085;

            margin-bottom: 30px;
        }

        .form-control {

            height: 52px;

            border-radius: 12px;

            border: 2px solid #e1e8f0;

            transition: 0.3s;
        }

        .form-control:focus {

            border-color: #0072ff;

            box-shadow:
                0 0 0 4px rgba(0,114,255,0.12);

            transform: translateY(-2px);
        }

        .login-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 17px;

            font-weight: 700;

            background: linear-gradient(
                90deg,
                #0066ff,
                #6a11cb
            );

            transition: 0.3s;

            box-shadow:
                0 10px 20px rgba(0,0,0,0.2);
        }

        .login-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(0,0,0,0.3);
        }

        .login-btn:active {

            transform: scale(0.97);
        }

        .error-message {

            margin-top: 15px;

            text-align: center;

            color: #dc3545;

            font-weight: 600;
        }

        .back-btn {

            display: block;

            margin-top: 20px;

            text-align: center;

            text-decoration: none;

            color: #0072ff;

            font-weight: 600;
        }

        .back-btn:hover {

            color: #6a11cb;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="admin-icon">
        🔐
    </div>

    <h2>Admin Login</h2>

    <p class="subtitle">
        Secure Election Administration
    </p>

    <form action="/adminlogin" method="post">

        <div class="mb-3">

            <label class="form-label fw-bold">
                👤 Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter admin username"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label fw-bold">
                🔑 Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter admin password"
                required>

        </div>

        <button
            type="submit"
            class="login-btn">

            🚀 Login

        </button>

    </form>

    <p
        class="error-message"
        th:if="${msg}"
        th:text="${msg}">
    </p>

    <a href="/" class="back-btn">
        ← Back to Voting Page
    </a>

</div>

</body>

</html>
