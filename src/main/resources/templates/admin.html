<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Online Voting System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #081b33,
                #0b4f6c,
                #087e8b,
                #05a6c9
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Background circles */

        body::before {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            top: -100px;
            left: -100px;

            animation: floating 7s infinite ease-in-out;

            z-index: -1;
        }

        body::after {
            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            bottom: -120px;
            right: -100px;

            animation: floating 8s infinite ease-in-out;

            z-index: -1;
        }

        @keyframes floating {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(35px);
            }

            100% {
                transform: translateY(0);
            }

        }

        /* Login Card */

        .login-card {

            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,0.98);

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.35);

            animation: cardAppear 0.7s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Admin Icon */

        .icon {

            width: 85px;
            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;

            background: linear-gradient(
                135deg,
                #0066ff,
                #00a6c7
            );

            color: white;

            box-shadow:
                0 10px 25px rgba(0,114,255,0.35);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }

        }

        /* Heading */

        h1 {

            text-align: center;

            margin: 0;

            font-size: 30px;

            font-weight: 800;

            background: linear-gradient(
                90deg,
                #0066ff,
                #00a6c7
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            text-align: center;

            color: #667085;

            margin-top: 10px;
            margin-bottom: 30px;

            font-size: 15px;
        }

        /* Form */

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

            color: #17324d;
        }

        input {

            width: 100%;

            height: 52px;

            padding: 12px 15px;

            border: 2px solid #e1e8f0;

            border-radius: 12px;

            font-size: 15px;

            transition: all 0.3s ease;

            background: white;
        }

        input:focus {

            outline: none;

            border-color: #0072ff;

            box-shadow:
                0 0 0 4px rgba(0,114,255,0.12);

            transform: translateY(-2px);
        }

        /* Login Button */

        .login-btn {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(
                90deg,
                #0066ff,
                #00a6c7
            );

            color: white;

            font-size: 17px;

            font-weight: 700;

            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(0,114,255,0.3);

            transition: all 0.3s ease;
        }

        .login-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(0,114,255,0.4);
        }

        .login-btn:active {

            transform: scale(0.97);
        }

        /* Error Message */

        .message {

            margin-top: 18px;

            padding: 12px;

            text-align: center;

            border-radius: 10px;

            background: #ffe5e5;

            color: #dc3545;

            font-weight: 600;

        }

        /* Back Button */

        .back {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #0066ff;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;
        }

        .back:hover {

            color: #003d99;

            transform: translateY(-2px);
        }

        /* Security Text */

        .security {

            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #667085;
        }

        /* Mobile */

        @media(max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }

            h1 {

                font-size: 25px;

            }

            .icon {

                width: 75px;
                height: 75px;

                font-size: 36px;

            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- Admin Icon -->

    <div class="icon">
        🔐
    </div>


    <!-- Heading -->

    <h1>
        Admin Login
    </h1>


    <p class="subtitle">
        Login to manage the Online Voting System
    </p>


    <!-- Login Form -->

    <form action="/admin/login"
          method="post">


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                👤 Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required>

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                🔑 Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required>

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="login-btn">

            🔐 Login

        </button>


    </form>


    <!-- Error / Message -->

    <p
        class="message"
        th:if="${msg}"
        th:text="${msg}">
    </p>


    <!-- Back -->

    <a href="/"
       class="back">

        ← Back to Voting Page

    </a>


    <!-- Security -->

    <div class="security">

        🔒 Secure Administrator Access

    </div>


</div>


</body>

</html>
