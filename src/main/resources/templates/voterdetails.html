<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Details</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            font-family: "Poppins", sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #312e81,
                #7c3aed,
                #0369a1
            );

            position: relative;

            overflow: hidden;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        .circle {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);

            z-index: 0;
        }


        .circle-one {

            width: 350px;

            height: 350px;

            top: -150px;

            left: -120px;

            background: rgba(139, 92, 246, 0.25);

            animation: floatOne 8s ease-in-out infinite;
        }


        .circle-two {

            width: 450px;

            height: 450px;

            right: -160px;

            bottom: -220px;

            background: rgba(6, 182, 212, 0.20);

            animation: floatTwo 10s ease-in-out infinite;
        }


        .circle-three {

            width: 160px;

            height: 160px;

            right: 15%;

            top: 18%;

            background: rgba(59, 130, 246, 0.18);

            animation: floatThree 6s ease-in-out infinite;
        }


        @keyframes floatOne {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(45px, 40px);
            }
        }


        @keyframes floatTwo {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-40px, -35px);
            }
        }


        @keyframes floatThree {

            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.12);
            }
        }


        /* =========================
           CARD
        ========================= */

        .voter-card {

            width: 100%;

            max-width: 500px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 25px;

            position: relative;

            z-index: 2;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.40);

            animation: cardAppear 0.9s ease;

            transition: all 0.4s ease;
        }


        .voter-card:hover {

            transform: translateY(-7px);

            box-shadow:
                0 40px 95px rgba(0, 0, 0, 0.45);
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(50px)
                    scale(0.92);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           ICON
        ========================= */

        .voter-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 17px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 38px;

            color: white;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb,
                #06b6d4
            );

            box-shadow:
                0 12px 30px rgba(79, 70, 229, 0.40);

            animation: iconFloat 2.5s ease-in-out infinite;
        }


        @keyframes iconFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            color: #312e81;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 6px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-bottom: 28px;
        }


        /* =========================
           DETAILS
        ========================= */

        .details-box {

            border-radius: 15px;

            overflow: hidden;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 8px 25px rgba(30, 41, 59, 0.08);
        }


        .detail-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 17px;

            background: white;

            border-bottom: 1px solid #e2e8f0;

            transition: all 0.3s ease;

            animation: rowAppear 0.6s ease both;
        }


        .detail-row:nth-child(1) {
            animation-delay: 0.2s;
        }


        .detail-row:nth-child(2) {
            animation-delay: 0.4s;
        }


        .detail-row:nth-child(3) {
            animation-delay: 0.6s;
        }


        .detail-row:last-child {

            border-bottom: none;
        }


        .detail-row:hover {

            background: #f5f3ff;

            transform: translateX(5px);
        }


        @keyframes rowAppear {

            from {

                opacity: 0;

                transform: translateX(-20px);
            }

            to {

                opacity: 1;

                transform: translateX(0);
            }
        }


        /* =========================
           LABEL
        ========================= */

        .detail-label {

            display: flex;

            align-items: center;

            gap: 9px;

            color: #475569;

            font-size: 13px;

            font-weight: 600;
        }


        /* =========================
           VALUE
        ========================= */

        .detail-value {

            color: #312e81;

            font-size: 13px;

            font-weight: 700;

            text-align: right;

            word-break: break-word;
        }


        /* =========================
           VOTER ID BADGE
        ========================= */

        .id-badge {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #ede9fe,
                #dbeafe
            );

            color: #4f46e5;

            border: 1px solid #c4b5fd;

            box-shadow:
                0 4px 12px rgba(79, 70, 229, 0.12);

            transition: all 0.3s ease;
        }


        .id-badge:hover {

            transform: scale(1.06);

            box-shadow:
                0 7px 18px rgba(79, 70, 229, 0.20);
        }


        /* =========================
           PARTY BADGE
        ========================= */

        .party-badge {

            display: inline-block;

            padding: 7px 15px;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #ede9fe
            );

            color: #4338ca;

            font-size: 12px;

            font-weight: 700;

            border: 1px solid #c4b5fd;

            transition: all 0.3s ease;
        }


        .party-badge:hover {

            transform: scale(1.08);

            box-shadow:
                0 5px 15px rgba(79, 70, 229, 0.20);
        }


        /* =========================
           FOOTER
        ========================= */

        .secure-text {

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 10px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: block;

            width: 100%;

            margin-top: 18px;

            padding: 12px;

            border-radius: 11px;

            text-align: center;

            text-decoration: none;

            color: white;

            font-size: 13px;

            font-weight: 700;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

            box-shadow:
                0 9px 20px rgba(79, 70, 229, 0.30);

            transition: all 0.3s ease;
        }


        .back-button:hover {

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 14px 28px rgba(79, 70, 229, 0.40);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 20px;
            }


            .voter-card {

                padding: 28px 20px;

                border-radius: 20px;
            }


            .voter-icon {

                width: 70px;

                height: 70px;

                font-size: 30px;
            }


            h1 {

                font-size: 23px;
            }


            .detail-row {

                padding: 14px;

                gap: 10px;
            }


            .detail-label,
            .detail-value {

                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<!-- Animated Background -->

<div class="circle circle-one"></div>

<div class="circle circle-two"></div>

<div class="circle circle-three"></div>


<!-- Voter Card -->

<div class="voter-card">


    <!-- Icon -->

    <div class="voter-icon">
        🪪
    </div>


    <!-- Heading -->

    <h1>
        Voter Details
    </h1>


    <p class="subtitle">
        Verified voter information
    </p>


    <!-- Details -->

    <div class="details-box">


        <!-- Name -->

        <div class="detail-row">

            <div class="detail-label">
                👤 Name
            </div>

            <div
                class="detail-value"
                th:text="${voter.name}">
            </div>

        </div>


        <!-- Voter ID -->

        <div class="detail-row">

            <div class="detail-label">
                🪪 Voter ID
            </div>

            <div class="detail-value">

                <span
                    class="id-badge"
                    th:text="${voter.voterId}">
                </span>

            </div>

        </div>


        <!-- Party -->

        <div class="detail-row">

            <div class="detail-label">
                🏛️ Party
            </div>

            <div class="detail-value">

                <span
                    class="party-badge"
                    th:text="${voter.party}">
                </span>

            </div>

        </div>


    </div>


    <!-- Back Button -->

    <a href="/"
       class="back-button">

        🏠 Back to Home

    </a>


    <!-- Footer -->

    <div class="secure-text">

        🔒 Secure • Verified • Online Voting System

    </div>


</div>


</body>

</html>
